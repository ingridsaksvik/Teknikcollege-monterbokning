<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Teknikcollege Dalarna - Monterbokning</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f5f7fa;
      margin: 0;
      color: #222;
    }

    .container {
      max-width: 1100px;
      margin: auto;
      padding: 30px 20px;
    }

    h1, h2 {
      color: #17365d;
    }

    .intro, .calendar-box, .booking-box {
      background: white;
      padding: 20px;
      border-radius: 10px;
      margin-bottom: 25px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }

    .transport-info {
      background: #fff4cc;
      border-left: 5px solid #f2c94c;
      padding: 15px;
      margin-top: 15px;
    }

    .calendar-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 15px;
    }

    .calendar-header h2 {
      margin: 0;
      text-align: center;
    }

    .nav-button {
      margin: 0;
      background: #17365d;
      color: white;
      border: none;
      border-radius: 5px;
      padding: 10px 15px;
      cursor: pointer;
    }

    .weekdays, .calendar {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 6px;
    }

    .weekday {
      text-align: center;
      font-weight: bold;
      color: #17365d;
      padding: 8px 2px;
    }

    .day {
      min-height: 125px;
      border: 1px solid #ddd;
      border-radius: 6px;
      padding: 7px;
      background: #fff;
    }

    .day.empty {
      background: #f4f4f4;
      border-color: #eee;
    }

    .date-number {
      font-weight: bold;
      margin-bottom: 7px;
    }

    .monter {
      display: block;
      width: 100%;
      margin: 5px 0;
      padding: 7px 5px;
      border: none;
      border-radius: 4px;
      font-size: 12px;
      cursor: pointer;
      text-align: left;
    }

    .available {
      background: #dff4e5;
      color: #155d2d;
    }

    .available:hover {
      background: #c8ebd2;
    }

    .booked {
      background: #e7ebf0;
      color: #555;
      cursor: default;
    }

    .past {
      opacity: 0.55;
    }

    label {
      display: block;
      font-weight: bold;
      margin-top: 15px;
      margin-bottom: 5px;
    }

    input, select, textarea {
      width: 100%;
      padding: 10px;
      font-size: 16px;
      border: 1px solid #bbb;
      border-radius: 5px;
    }

    textarea {
      min-height: 80px;
    }

    .submit-button {
      margin-top: 20px;
      padding: 12px 20px;
      background: #17365d;
      color: white;
      border: none;
      border-radius: 5px;
      font-size: 16px;
      cursor: pointer;
    }

    .submit-button:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    #message {
      margin-top: 15px;
      font-weight: bold;
    }

    .success {
      color: #16743b;
    }

    .error {
      color: #b42318;
    }

      display: none;
